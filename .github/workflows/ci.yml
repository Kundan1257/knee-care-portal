name: Production Build Guard CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository source branch
      uses: actions/checkout@v4

    - name: Set up Node.js cloud runtime environment
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Safe Install package node dependencies
      run: npm ci

    - name: Run Production Bundle Compiler Guard Test
      run: npm run build
