    <!-- 🟢 FIXED SDK ELEMENT LAYER: Points straight to the lightweight Checkout SDK script file -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  </head>
  <body>
    <!-- 🚀 THE PERSISTENT GLOBAL ENTRY CORE: Placed cleanly right inside the body element workspace -->
    <script>
      (function() {
        if (typeof window.stashedInstallPrompt === 'undefined' || window.stashedInstallPrompt === null) {
          window.stashedInstallPrompt = null;
        }
        
        window.addEventListener('beforeinstallprompt', function(e) {
          e.preventDefault();
          window.stashedInstallPrompt = e;
          console.log("PWA Hardware Token captured perfectly inside absolute root memory!");
          
          window.dispatchEvent(new CustomEvent('pwa-token-ready'));
          
          if (typeof window.updateCustomInstallButton === 'function') {
            window.updateCustomInstallButton();
          }
        });
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
